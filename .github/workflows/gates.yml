# Die Gates aus `docs/engineering/quality-gates.md`, maschinell. Vier fuer den
# Client, seit dem 03.09.2026 ein fuenftes fuer das Datenbankschema.
#
# Warum es das gibt: bis zum 31.08.2026 lief kein einziges Gate automatisch.
# Alle vier hingen daran, dass jemand vier Befehle startet, und `HANDOFF.md`
# hielt ausdrücklich fest: „Es gibt **keinen** CI-Workflow, diese vier Befehle
# laufen nur, wenn jemand sie startet."
#
# ## Was hier bewusst NICHT läuft, und warum
#
# Die drei Drift-Werkzeuge (`generate_i18n`, `bake_map_style`,
# `generate_curated_data`) stehen nicht in diesem Workflow. Zwei davon lesen die
# PWA im **Lese-Repo**, und das liegt auf einem privaten Rechner, nicht im
# Repository. Sie brechen ohne Quelle mit Exit-Code 2 und einer Anleitung ab.
# `flutter test` läuft trotzdem, weil die erzeugten Dateien versioniert sind.
#
# **Folge, die man kennen muss:** eine von Hand bearbeitete erzeugte Datei
# kommt durch diesen Workflow. Das ist gemessen und nicht vermutet, ein
# verfälschter Hotspot-Name ließ am 31.08.2026 alle 1792 Tests grün und schlug
# nur im Drift-Werkzeug an. Die drei Prüfungen bleiben lokal, bis CI Zugang zur
# Quelle hat, und `quality-gates.md` sagt das auch dort.
#
# ## Warum keine Fremd-Action für das SDK
#
# Der Flutter-Stand wird per `git clone` auf ein **Tag** festgenagelt, statt
# eine Action eines Dritten zu benutzen. Eine Action ist eine Abhängigkeit wie
# jede andere, und `CLAUDE.md` macht neue Abhängigkeiten zustimmungspflichtig.
# `actions/checkout` ist GitHubs eigene und ohne sie geht nichts.
#
# Der Stand ist derselbe, mit dem lokal geprüft wird: Flutter 3.44.1, Dart
# 3.12.1. Wer ihn hebt, hebt ihn hier und in `HANDOFF.md` unter „Rechner
# einrichten" gemeinsam, sonst prüfen zwei verschiedene Stände.

name: Gates

on:
  push:
    branches:
      - main
      # Die Arbeitszweige laufen mit. Bis zum 31.08.2026 stand hier nur
      # `main`, und das hieß: auf genau dem Zweig, auf dem gebaut wird, lief
      # kein einziges Gate maschinell. Gemessen und nicht vermutet, `gh run
      # list` zeigte an diesem Abend fünf Pushes ohne einen einzigen Lauf.
      # Ein Tor, das erst beim Zusammenführen zuschlägt, meldet den Fehler
      # eine Tagesarbeit zu spät.
      - "claude/**"
  pull_request:

# Ein laufender Durchgang wird abgebrochen, wenn derselbe Zweig neu geschoben
# wird. Bei einer Kette kleiner Commits zählt nur der letzte.
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Format, Analyze, Architektur, Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: Flutter-SDK auf 3.44.1 festnageln
        run: |
          git clone --depth 1 --branch 3.44.1 \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Stand ausgeben
        run: flutter --version

      - name: Pakete holen
        run: flutter pub get

      # Ab hier die vier Gates, in derselben Reihenfolge wie in
      # `quality-gates.md`. Jeder Schritt bricht den Lauf bei einem Fehler ab,
      # das ist der Standard und hier ausdrücklich gewollt.

      - name: Gate 1, Format
        run: dart format --output=none --set-exit-if-changed lib test tool

      # `--fatal-infos`, seit dem 02.09.2026. Ohne die Flagge kippt ein
      # `info` das Tor nicht, und genau daran standen hier über Wochen 24
      # Hinweise, die niemanden mehr erreicht haben: wo 24 Meldungen stehen,
      # fällt die 25. nicht auf. Seit sie weg sind, kostet die Flagge nichts
      # und hält den Stand.
      - name: Gate 2, Analyzer
        run: dart analyze --fatal-infos

      - name: Gate 3, Architektur
        run: dart run tool/check_architecture.dart

      - name: Gate 4, Tests
        run: flutter test

      # Der erzeugte Code, und der Posten ist viel kleiner, als er im
      # Statusdokument aussah. Von den sechs `*.g.dart` im Baum stammt genau
      # **eine** von `build_runner`, `lib/app/routing/app_routes.g.dart` aus
      # `go_router_builder`. Die anderen fünf erzeugen die drei eigenen
      # Werkzeuge, und die haben ihre Drift-Prüfung mit `--check` längst.
      #
      # **Warum nur hier und nicht lokal.** Der Lauf dauert gemessen 40
      # Sekunden, und das für eine einzige Datei; die vier lokalen Tore
      # zusammen liegen darunter. Ein Tor, das niemand mehr abwartet, ist
      # keins. Dazu kommt, dass `git diff` auf Windows an dieser Datei durch
      # die Zeilenenden-Umschreibung anschlägt, obwohl der Inhalt gleich ist,
      # am 02.09.2026 gemessen. Hier läuft Linux, dort gibt es das Problem
      # nicht.
      - name: Erzeugter Code, go_router_builder
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib/app/routing/app_routes.g.dart

  # ── Gate 5, das Schema baut von null ────────────────────────────────────────
  #
  # Die einzige Prüfung, die dem alten Backend gefehlt hat, und aus ihrer
  # Abwesenheit folgt fast alles, was in `docs/operations/backend-inventory.md`
  # steht. Dort tragen acht SQL-Dateien den Satz „Run manually in Supabase SQL
  # Editor" im Kopf, zwei Funktionen sind doppelt definiert, und welche Fassung
  # produktiv läuft, hängt daran, in welcher Reihenfolge jemand Dateien in
  # einen Editor kopiert hat. Siehe ADR-010.
  #
  # `supabase db start` startet ein leeres Postgres und wendet `migrations/*`
  # alphabetisch an. Bricht eine Migration, ist dieser Lauf rot.
  #
  # **Ein eigener Job und nicht ein fünfter Schritt im ersten.** Er braucht
  # Docker und kein Flutter, der erste braucht Flutter und kein Docker. Als
  # Schritt im ersten Job würde ein kaputtes Schema die vier Client-Gates mit
  # ausbremsen, und umgekehrt.
  #
  # **Warum das lokal nicht läuft:** auf dem Rechner, auf dem dieses
  # Repository gepflegt wird, ist kein Docker installiert, gemessen am
  # 03.09.2026. `quality-gates.md` nennt deshalb weiterhin vier lokale Tore.
  # Wer Docker hat, fährt es mit denselben zwei Befehlen.
  #
  # **Was hier bewusst noch fehlt:** die vier inhaltlichen Zusicherungen aus
  # ADR-010 (kein Tisch ohne RLS, keine Policy mit `USING (true)`, keine
  # `SECURITY DEFINER`-Funktion mit Nutzerkennung als Parameter, kein
  # doppeltes Gutschreiben). An einer leeren Datenbank wären alle vier grün,
  # ohne etwas geprüft zu haben. Sie kommen mit dem Schema, siehe
  # `supabase/README.md`.
  schema:
    name: Gate 5, Schema baut von null
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      # Die CLI kommt über npm und nicht über eine Fremd-Action, aus demselben
      # Grund wie beim Flutter-SDK weiter oben: eine Action ist eine
      # Abhängigkeit wie jede andere. Die Fassung ist festgenagelt, damit hier
      # und lokal dasselbe Werkzeug läuft.
      - name: Supabase-CLI auf 2.116.0 festnageln
        run: npm install --global supabase@2.116.0

      - name: Stand ausgeben
        run: supabase --version

      - name: Gate 5, alle Migrationen von null anwenden
        run: supabase db start

      - name: Gate 5b, Linter über das entstandene Schema
        run: supabase db lint --level warning
