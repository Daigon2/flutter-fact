include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    # Erzwingt package:-Importe. Ohne das sind beide Importstile erlaubt, und
    # ein relatives '../../anderes_feature/presentation/x.dart' ist optisch
    # harmlos, verletzt aber Regel 8 der dependency-rules. Der
    # Architektur-Check erkennt inzwischen beide Formen; diese Regel sorgt
    # dafür, dass die riskantere gar nicht erst entsteht.
    always_use_package_imports: true
    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_print: true
    cancel_subscriptions: true
    close_sinks: true
    directives_ordering: true
    discarded_futures: true
    no_adjacent_strings_in_list: true
    prefer_final_locals: true
    prefer_single_quotes: true
    sort_constructors_first: true
    unawaited_futures: true
    use_build_context_synchronously: true
