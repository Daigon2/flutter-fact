name: fact_app
description: "FACT: gamifizierter Stadtführer für iOS und Android."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  flutter_svg: ^2.3.0
  geolocator: ^14.0.3
  go_router: ^18.0.0
  # Bewusst auf 0.26.x festgenagelt, nicht auf 0.27.0. Belegt am 27.08.2026 beim
  # ersten Geraetebuild: mit AGP 9.0.1 aus dem Flutter-Template gibt es keine
  # Einstellung, mit der 0.27.0 und `app_links` gleichzeitig bauen.
  #
  #   android.builtInKotlin=false  ->  maplibre_gl 0.27.0 scheitert. Es wendet ab
  #     AGP 9 das Kotlin-Plugin absichtlich nicht mehr selbst an und erwartet die
  #     `kotlin`-Erweiterung von AGP, die es mit `false` nirgends gibt:
  #     "Could not find method kotlin() ... on project ':maplibre_gl'".
  #   android.builtInKotlin=true   ->  `app_links` scheitert. AGP 9 lehnt es ab,
  #     wenn das Kotlin-Plugin zusaetzlich von aussen angewendet wird, und genau
  #     das tut Flutters Gradle-Plugin fuer Plugin-Module.
  #
  # 0.26.1 wendet `kotlin-android` unbedingt an und ist damit mit dem
  # Template-Standard `false` verstaendlich. `flutter pub outdated` sagt fuer
  # beide Pakete "all up-to-date", es gibt also keinen Weg nach vorn.
  # Wieder anheben, sobald `app_links` oder Flutters Gradle-Plugin nachgezogen
  # hat, und dann den ersten Geraetebuild erneut fahren.
  maplibre_gl: ^0.26.1
  supabase_flutter: ^2.17.2

dev_dependencies:
  build_runner: ^2.15.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.4.0

flutter:
  uses-material-design: true

  fonts:
    - family: Nunito
      fonts:
        # 600 wird von der PWA für die Tab-Bar und die Modus-Chips genutzt
        # (chrome.jsx:115 und :197, screen-entdecken.jsx:170). Google Fonts
        # liefert dafür keine statische Datei mehr, nur noch die variable
        # Nunito[wght].ttf. Diese Instanz ist daraus mit fontTools bei wght=600
        # herausgeschnitten, deshalb ist sie größer als die anderen drei: sie
        # trägt den vollen Zeichensatz statt nur Latin.
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
