name: fact_app
description: "FACT: gamifizierter Stadtführer für iOS und Android."
publish_to: "none"
version: 1.0.0+1

environment:
  # Am 31.08.2026 von ^3.9.0 angehoben, weil `flutter_rotation_sensor 0.4.0` es
  # verlangt (`environment.sdk: ^3.12.1`, an der pub.dev-API nachgelesen und
  # nicht vermutet).
  #
  # **Das ist kein bequemer Spielraum, sondern genau die installierte Fassung.**
  # Die lokale SDK ist Dart 3.12.1, und `.github/workflows/gates.yml` nagelt
  # Flutter 3.44.1 fest, das dieselbe Dart-Fassung mitbringt. Der Neubau baut
  # damit ab jetzt **nicht** mehr auf einer älteren Flutter-Fassung, und wer
  # eine ältere benutzt, bekommt einen Auflösungsfehler und keinen stillen
  # Rückfall. Beabsichtigt: ein Auflösungsfehler ist die billigste Form dieser
  # Nachricht.
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  flutter_svg: ^2.3.0
  # Die absolute Geräteorientierung für die Kompass-Drehung, Schritt 14.
  # Am 31.08.2026 freigegeben (D-13), die Auswahl war ausdrücklich zu
  # recherchieren und zu begründen; die Begründung steht in
  # `REBUILD_STATUS.md` unter „Schritt 14, die Wahl des Sensorpakets".
  #
  # Kurz: die Quelle braucht eine **absolute** Richtung und verwirft relative
  # Ereignisse ausdrücklich (`screen-map.jsx:2817-2823`). `sensors_plus` liefert
  # nur Rohwerte und keine Fusion, `flutter_compass` ist seit 21 Monaten ohne
  # Veröffentlichung. Dieses Paket liefert den Azimut der Plattform und lässt
  # seit 0.3.0 den Bezugsrahmen wählen.
  #
  # **Bewusst unter 0.4.0 gehalten, und zwar gemessen.** `^0.3.1` heisst bei
  # einer 0.x-Fassung `>=0.3.1 <0.4.0`, schliesst 0.4.0 also von selbst aus. Der
  # Grund ist derselbe wie bei `maplibre_gl` weiter unten, nur an einer anderen
  # Stelle: 0.4.0 hat Web-Unterstützung bekommen und dafür `intl ^0.20.3`
  # aufgenommen, während `flutter_localizations` aus der Flutter-SDK `intl
  # 0.20.2` festnagelt. `flutter pub get` bricht damit mit
  # "version solving failed" ab. Web braucht dieser Neubau nicht, 0.3.1 ist für
  # ihn also kein Verzicht, sondern die Fassung ohne das Web-Plugin.
  #
  # 0.3.1 und nicht 0.3.0: der Änderungseintrag von 0.3.1 nennt ausgerechnet
  # "corrected iOS orientation values".
  #
  # Wieder anheben, sobald die Flutter-SDK `intl 0.20.3` mitbringt.
  #
  # Heimatverzeichnis `lib/services/orientation/`, durchgesetzt als Regel 24.
  flutter_rotation_sensor: ^0.3.1
  geolocator: ^14.0.3
  go_router: ^18.0.0
  # Bewusst auf 0.26.x festgenagelt, nicht auf 0.27.0. Belegt am 27.08.2026 beim
  # ersten Geraetebuild: mit AGP 9.0.1 aus dem Flutter-Template gibt es keine
  # Einstellung, mit der 0.27.0 und `app_links` gleichzeitig bauen.
  #
  #   android.builtInKotlin=false  ->  maplibre_gl 0.27.0 scheitert. Es wendet ab
  #     AGP 9 das Kotlin-Plugin absichtlich nicht mehr selbst an und erwartet die
  #     `kotlin`-Erweiterung von AGP, die es mit `false` nirgends gibt:
  #     "Could not find method kotlin() ... on project ':maplibre_gl'".
  #   android.builtInKotlin=true   ->  `app_links` scheitert. AGP 9 lehnt es ab,
  #     wenn das Kotlin-Plugin zusaetzlich von aussen angewendet wird, und genau
  #     das tut Flutters Gradle-Plugin fuer Plugin-Module.
  #
  # 0.26.1 wendet `kotlin-android` unbedingt an und ist damit mit dem
  # Template-Standard `false` verstaendlich. `flutter pub outdated` sagt fuer
  # beide Pakete "all up-to-date", es gibt also keinen Weg nach vorn.
  # Wieder anheben, sobald `app_links` oder Flutters Gradle-Plugin nachgezogen
  # hat, und dann den ersten Geraetebuild erneut fahren.
  maplibre_gl: ^0.26.1
  # Der Gerätespeicher der fünf Präferenz- und Zustandsspeicher. Am 31.08.2026
  # freigegeben; ADR-007 hatte es empfohlen und die Aufnahme ausdrücklich der
  # Zustimmung überlassen.
  #
  # Es kommt kein neuer Code in den Bau: das Paket lag schon als transitive
  # Abhängigkeit von `supabase_flutter` im Baum (`pubspec.lock`, 2.5.5). Hier
  # steht nur noch, dass die App es direkt braucht.
  #
  # Ein Heimatverzeichnis hat es auch: `lib/services/preferences/`, durchgesetzt
  # als Regel 22 in `docs/architecture/dependency-rules.md`.
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.17.2
  flutter_tts: ^4.2.5
  audioplayers: ^6.8.1

dev_dependencies:
  build_runner: ^2.15.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.4.0
  # Nur für Tests, geht nicht in die App. `SupabaseClient` nimmt seinen
  # `httpClient` als `http.Client` entgegen, und kein Supabase-Paket exportiert
  # den Typ weiter. Damit ist er die einzige Möglichkeit, die vier
  # Instanzmethoden der Datenquelle ohne Netz zu prüfen. Das Paket lag ohnehin
  # transitiv im Baum; hier steht nur noch, dass die Tests es direkt brauchen.
  http: ^1.6.0

flutter:
  uses-material-design: true

  assets:
    # Gebackener Kartenstil. Erzeugt aus tool/map_style/liberty_upstream.json
    # von tool/bake_map_style.dart, nicht von Hand bearbeiten.
    # Drift prüfen: dart run tool/bake_map_style.dart --check
    - assets/map/fact_map_style.json

    # Der Hinweiston des Audio-Modus, unveraendert aus
    # 02_Frontend/app/assets/beacon.mp3 der Verhaltensquelle uebernommen
    # (4170 Bytes). Die Quelle laedt ihn als assets/beacon.mp3; hier liegt
    # er unter assets/audio/, weil assets/ hier mehrere Arten haelt.
    - assets/audio/beacon.mp3

  fonts:
    - family: Nunito
      fonts:
        # 600 wird von der PWA für die Tab-Bar und die Modus-Chips genutzt
        # (chrome.jsx:115 und :197, screen-entdecken.jsx:170). Google Fonts
        # liefert dafür keine statische Datei mehr, nur noch die variable
        # Nunito[wght].ttf. Diese Instanz ist daraus mit fontTools bei wght=600
        # herausgeschnitten, deshalb ist sie größer als die anderen drei: sie
        # trägt den vollen Zeichensatz statt nur Latin.
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
